name: CI

on:
  push:
  pull_request:

jobs:
  # ── Python package ────────────────────────────────────────────────────────

  py-quality:
    name: Python quality (3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov

  py-compatibility:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - run: uv run pytest

  py-package:
    name: Python package build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --group dev
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: uv venv /tmp/teleglance-smoke
      - run: uv pip install --python /tmp/teleglance-smoke/bin/python "click>=8.1" dist/*.whl
      - run: /tmp/teleglance-smoke/bin/teleglance --help

  # ── TypeScript package ────────────────────────────────────────────────────

  ts-quality:
    name: TypeScript quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  ts-package:
    name: TypeScript package build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node -e "require('./dist/index.cjs')" 2>/dev/null || node --input-type=module --eval "import './dist/index.js'"
