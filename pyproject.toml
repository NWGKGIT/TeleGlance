[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleglance"
version = "0.2.0"
description = "Async client for public Telegram channels via t.me web previews — no API keys, no MTProto"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nahom W" }]
keywords = ["telegram", "t.me", "channels", "scraper", "async", "preview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/NWGKGIT/TeleGlance"
Repository = "https://github.com/NWGKGIT/TeleGlance"
Issues = "https://github.com/NWGKGIT/TeleGlance/issues"
Changelog = "https://github.com/NWGKGIT/TeleGlance/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = ["click>=8.1"]
socks = ["httpx[socks]"]

[project.scripts]
teleglance = "teleglance.cli:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teleglance"]

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/.coverage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["teleglance"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/teleglance"]
