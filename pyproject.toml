[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleglance"
version = "0.1.0"
description = "Async client for public Telegram channels via t.me web previews — no API keys, no MTProto"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Nahom W" }]
keywords = ["telegram", "t.me", "channels", "scraper", "async", "preview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
socks = ["httpx[socks]"]

[project.scripts]
teleglance = "teleglance.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teleglance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
